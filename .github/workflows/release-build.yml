name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Build binary
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p build
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=$VERSION" \
            -o build/renovate-scheduler${{ matrix.os == 'windows' && '.exe' || '' }} .

      - name: Create tarball
        if: matrix.os != 'windows'
        run: |
          cd build
          tar -czf renovate-scheduler-${{ matrix.os }}-${{ matrix.arch }}.tar.gz \
            renovate-scheduler
          cd ..

      - name: Create zip
        if: matrix.os == 'windows'
        run: |
          cd build
          Compress-Archive -Path renovate-scheduler.exe `
            -DestinationPath renovate-scheduler-${{ matrix.os }}-${{ matrix.arch }}.zip
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: binaries
          path: build/renovate-scheduler-*

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-binary, build-docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Extract changelog section for this version
          awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | head -n -1 > release_notes.md

          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: binaries/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: create-release
    if: always()
    steps:
      - name: Release workflow status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Release successful: ${{ github.ref }}"
          else
            echo "❌ Release failed: ${{ github.ref }}"
          fi
