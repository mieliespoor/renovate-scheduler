name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install golangci-lint with current Go toolchain
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: golangci-lint
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m

      - name: Check go.mod/go.sum sync
        run: go mod tidy && git diff --exit-code go.mod go.sum

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${{ github.sha }}" \
            -o renovate-scheduler .

      - name: Verify binary
        run: ./renovate-scheduler --version 2>&1 || echo "Binary built successfully"

  helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/renovate-scheduler

      - name: Render chart
        run: helm template renovate-scheduler helm/renovate-scheduler > /dev/null

      - name: Package chart
        run: helm package helm/renovate-scheduler --destination dist

  helm-integration:
    name: Helm Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: renovate-scheduler-integration

      - name: Build scheduler image
        run: docker build --tag renovate-scheduler:e2e .

      - name: Load scheduler image into Kind
        run: kind load docker-image renovate-scheduler:e2e --name renovate-scheduler-integration

      - name: Install chart and verify scheduler startup
        run: bash integration/helm-smoke.sh

      - name: Collect Kubernetes diagnostics
        if: failure()
        run: |
          kubectl get all --namespace renovate-scheduler
          kubectl describe pods --namespace renovate-scheduler
          kubectl logs deployment/renovate-scheduler-renovate-scheduler --namespace renovate-scheduler --all-containers=true

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: renovate-scheduler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()
