project_name: renovate-scheduler

release:
  github:
    owner: mieliespoor
    name: renovate-scheduler
  name_template: 'Release v{{ .Version }}'
  draft: false
  prerelease: auto

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: renovate-scheduler
    main: .
    binary: renovate-scheduler
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'
    format_overrides:
      - goos: windows
        format: zip
    wrap_in_directory: false

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  name_template: '{{ .Tag }}-next'

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: 'Performance'
      regexp: '^.*?perf(\(.+\))?!?:.+$'
      order: 2
    - title: 'Documentation'
      regexp: '^.*?docs(\(.+\))?!?:.+$'
      order: 3
    - title: 'Others'
      order: 999

dockers:
  - image_templates:
      - 'ghcr.io/mieliespoor/{{ .ProjectName }}:{{ .Version }}'
      - 'ghcr.io/mieliespoor/{{ .ProjectName }}:latest'
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - '--platform=linux/amd64,linux/arm64'
      - '--label=org.opencontainers.image.created={{.Date}}'
      - '--label=org.opencontainers.image.title={{.ProjectName}}'
      - '--label=org.opencontainers.image.revision={{.FullCommit}}'
      - '--label=org.opencontainers.image.version={{.Version}}'
